<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>给你的一封信</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        font-size: 18px;
    }

    body {
        margin: 0;
        padding: 0;
        background: #f7f4ee;
        color: #222;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Noto Sans SC",
            "Microsoft YaHei",
            "PingFang SC",
            sans-serif;
    }

    .page {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 28px 80px;
    }

    /* =========================
       标题
    ========================= */

    .title {
        text-align: center;
        margin-bottom: 10px;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 2px;
    }

    .subtitle {
        text-align: center;
        font-size: 18px;
        line-height: 1.8;
        color: #666;
        margin-bottom: 36px;
    }

    /* =========================
       播放区域
    ========================= */

    .player {
        text-align: center;
        margin-bottom: 42px;
    }

    .play-button {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: none;
        background: #222;
        color: white;
        cursor: pointer;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        font-size: 42px;

        transition: transform 0.15s ease;
    }

    .play-button:hover {
        transform: scale(1.04);
    }

    .play-button:active {
        transform: scale(0.97);
    }

    .play-button:focus-visible {
        outline: 4px solid #888;
        outline-offset: 6px;
    }

    .play-icon {
        margin-left: 7px;
        margin-top: 2px;
    }

    .pause-icon {
        margin-left: 0;
    }

    .time {
        margin-top: 18px;
        font-size: 18px;
        color: #555;
        letter-spacing: 1px;
    }

    /* =========================
       进度条
    ========================= */

    .progress-container {
        width: 100%;
        max-width: 620px;
        height: 12px;
        margin: 20px auto 0;
        background: #ddd8cf;
        border-radius: 20px;
        cursor: pointer;
        overflow: hidden;
    }

    .progress {
        width: 0%;
        height: 100%;
        background: #333;
        border-radius: 20px;
    }

    /* =========================
       分隔线
    ========================= */

    .divider {
        width: 100%;
        height: 1px;
        background: #d8d2c8;
        margin-bottom: 42px;
    }

    /* =========================
       信件区域
    ========================= */

    .letter {
        font-size: 28px;
        line-height: 2.05;
        letter-spacing: 1px;
        font-weight: 400;
    }

    .sentence {
        margin: 0 0 28px;
    }

    /* =========================
       播放模式
    ========================= */

    .listening-mode {
        display: none;
    }

    .listening-mode.active {
        display: block;
    }

    .listening-sentence {
        font-size: 30px;
        line-height: 2;
        margin-bottom: 30px;

        animation: appear 0.35s ease;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================
       手机端
    ========================= */

    @media (max-width: 600px) {

        .page {
            padding: 36px 24px 70px;
        }

        .title {
            font-size: 30px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 32px;
        }

        .play-button {
            width: 125px;
            height: 125px;
            font-size: 44px;
        }

        .time {
            font-size: 18px;
        }

        .letter {
            font-size: 30px;
            line-height: 2.15;
            letter-spacing: 1px;
        }

        .sentence {
            margin-bottom: 32px;
        }

        .listening-sentence {
            font-size: 32px;
            line-height: 2.1;
            margin-bottom: 32px;
        }
    }

    /* =========================
       减少动画
    ========================= */

    @media (prefers-reduced-motion: reduce) {
        * {
            animation: none !important;
            transition: none !important;
        }
    }
</style>
</head>

<body>

<div class="page">

    <!-- 标题 -->

    <h1 class="title">给你的一封信</h1>

    <div class="subtitle">
        有些话，我还是想亲口告诉你。
    </div>


    <!-- 播放器 -->

    <div class="player">

        <button
            class="play-button"
            id="playButton"
            aria-label="播放录音"
        >
            <span id="playIcon" class="play-icon">▶</span>
        </button>

        <div class="time">
            <span id="currentTime">0:00</span>
            /
            <span id="duration">0:00</span>
        </div>

        <div
            class="progress-container"
            id="progressContainer"
            aria-label="音频播放进度"
        >
            <div class="progress" id="progress"></div>
        </div>

    </div>


    <div class="divider"></div>


    <!-- =========================
         播放前：完整信件
    ========================== -->

    <div id="fullLetter" class="letter">

        <p class="sentence">
            亲爱的，
        </p>

        <p class="sentence">
            我有一些话想告诉你。
        </p>

        <p class="sentence">
            这些话，我想了很久。
        </p>

        <p class="sentence">
            我不知道应该从哪里开始说起，
            但我还是想把它们告诉你。
        </p>

        <p class="sentence">
            有些事情过去了很久，
            我也慢慢想明白了一些。
        </p>

        <p class="sentence">
            所以最后，我还是决定写下这封信。
        </p>

        <p class="sentence">
            希望你能够听到。
        </p>

        <p class="sentence">
            也希望你能够明白我的意思。
        </p>

        <p class="sentence">
            就这样。
        </p>

    </div>


    <!-- =========================
         播放中：逐句出现
    ========================== -->

    <div id="listeningLetter" class="listening-mode letter">

        <!--
        data-start = 这一句开始播放的秒数
        data-end   = 下一句开始播放前的秒数

        下面只是测试时间。
        等最终录音确定以后，再重新调整。
        -->

        <p
            class="listening-sentence"
            data-start="0"
            data-end="4"
        >
            亲爱的，
        </p>

        <p
            class="listening-sentence"
            data-start="4"
            data-end="9"
        >
            我有一些话想告诉你。
        </p>

        <p
            class="listening-sentence"
            data-start="9"
            data-end="15"
        >
            这些话，我想了很久。
        </p>

        <p
            class="listening-sentence"
            data-start="15"
            data-end="24"
        >
            我不知道应该从哪里开始说起，
            但我还是想把它们告诉你。
        </p>

        <p
            class="listening-sentence"
            data-start="24"
            data-end="34"
        >
            有些事情过去了很久，
            我也慢慢想明白了一些。
        </p>

        <p
            class="listening-sentence"
            data-start="34"
            data-end="42"
        >
            所以最后，我还是决定写下这封信。
        </p>

        <p
            class="listening-sentence"
            data-start="42"
            data-end="47"
        >
            希望你能够听到。
        </p>

        <p
            class="listening-sentence"
            data-start="47"
            data-end="53"
        >
            也希望你能够明白我的意思。
        </p>

        <p
            class="listening-sentence"
            data-start="53"
            data-end="57"
        >
            就这样。
        </p>

    </div>


    <!-- 音频 -->

    <audio id="audio" preload="metadata">
        <source src="audio.mp3" type="audio/mpeg">
        你的浏览器不支持音频播放。
    </audio>

</div>


<script>

const audio = document.getElementById("audio");

const playButton = document.getElementById("playButton");
const playIcon = document.getElementById("playIcon");

const currentTimeText = document.getElementById("currentTime");
const durationText = document.getElementById("duration");

const progress = document.getElementById("progress");
const progressContainer = document.getElementById("progressContainer");

const fullLetter = document.getElementById("fullLetter");
const listeningLetter = document.getElementById("listeningLetter");

const sentences = document.querySelectorAll(".listening-sentence");


/* =========================
   时间格式
========================= */

function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    const minutes = Math.floor(seconds / 60);

    const remainingSeconds = Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return minutes + ":" + remainingSeconds;
}


/* =========================
   音频加载完成
========================= */

audio.addEventListener("loadedmetadata", function() {

    durationText.textContent =
        formatTime(audio.duration);

});


/* =========================
   播放 / 暂停
========================= */

playButton.addEventListener("click", function() {

    if (audio.paused) {

        audio.play();

        fullLetter.style.display = "none";
        listeningLetter.classList.add("active");

    } else {

        audio.pause();

    }

});


/* =========================
   播放状态
========================= */

audio.addEventListener("play", function() {

    playIcon.textContent = "Ⅱ";
    playIcon.classList.add("pause-icon");

    playButton.setAttribute(
        "aria-label",
        "暂停录音"
    );

});


audio.addEventListener("pause", function() {

    playIcon.textContent = "▶";
    playIcon.classList.remove("pause-icon");

    playButton.setAttribute(
        "aria-label",
        "播放录音"
    );

});


/* =========================
   播放进度
========================= */

audio.addEventListener("timeupdate", function() {

    const current = audio.currentTime;

    const duration = audio.duration;

    currentTimeText.textContent =
        formatTime(current);

    if (!isNaN(duration) && duration > 0) {

        const percent =
            (current / duration) * 100;

        progress.style.width =
            percent + "%";

    }


    /* =========================
       控制逐句显示
    ========================= */

    sentences.forEach(function(sentence) {

        const start =
            parseFloat(sentence.dataset.start);

        const end =
            parseFloat(sentence.dataset.end);

        if (
            current >= start &&
            current < end
        ) {

            sentence.style.display = "block";

        }

    });

});


/* =========================
   点击进度条跳转
========================= */

progressContainer.addEventListener(
    "click",
    function(event) {

        if (!audio.duration) {
            return;
        }

        const rect =
            progressContainer.getBoundingClientRect();

        const clickPosition =
            event.clientX - rect.left;

        const percentage =
            clickPosition / rect.width;

        audio.currentTime =
            percentage * audio.duration;

    }
);


/* =========================
   音频播放结束
========================= */

audio.addEventListener("ended", function() {

    /*
       回到最开始的完整信件
    */

    listeningLetter.classList.remove("active");

    fullLetter.style.display = "block";


    /*
       把逐句模式重新隐藏，
       这样下一次播放时会重新从第一句出现
    */

    sentences.forEach(function(sentence) {

        sentence.style.display = "none";

    });


    progress.style.width = "0%";

    currentTimeText.textContent = "0:00";

    playIcon.textContent = "▶";

    playIcon.classList.remove("pause-icon");

    playButton.setAttribute(
        "aria-label",
        "播放录音"
    );

});


/* =========================
   页面第一次加载时，
   隐藏播放模式的所有句子
========================= */

sentences.forEach(function(sentence) {

    sentence.style.display = "none";

});

</script>

</body>
</html>
