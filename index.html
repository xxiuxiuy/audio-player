```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>给你的一封信</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f4ee;
            color: #222222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;
            line-height: 1.9;
        }

        .page {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        /* 顶部标题 */

        .intro {
            text-align: center;
            margin-bottom: 36px;
        }

        .intro h1 {
            margin: 0 0 12px;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .intro p {
            margin: 0;
            font-size: 17px;
            color: #555555;
        }

        /* 播放器 */

        .player {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            margin-bottom: 42px;
        }

        .player-label {
            font-size: 16px;
            color: #666666;
            margin-bottom: 20px;
        }

        .play-button {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: none;
            background: #222222;
            color: #ffffff;
            font-size: 44px;
            line-height: 110px;
            padding: 0;
            cursor: pointer;
            transition: transform 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .play-button:active {
            transform: scale(0.94);
        }

        .play-button:focus-visible {
            outline: 4px solid #999999;
            outline-offset: 5px;
        }

        .play-text {
            margin-top: 16px;
            font-size: 18px;
            font-weight: 500;
        }

        .time {
            margin-top: 12px;
            font-size: 15px;
            color: #666666;
        }

        .progress {
            width: 100%;
            height: 8px;
            margin-top: 22px;
            border-radius: 10px;
            background: #e6e3dd;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #222222;
            transition: width 0.2s linear;
        }

        /* 信件 */

        .letter {
            background: #fffefa;
            border-radius: 16px;
            padding: 42px 34px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.04);
        }

        .letter-title {
            margin: 0 0 30px;
            font-size: 24px;
            font-weight: 600;
        }

        .letter-content {
            font-size: 19px;
            line-height: 2.15;
        }

        .sentence {
            display: inline;
            padding: 2px 3px;
            border-radius: 5px;
            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }

        /* 当前正在播放的句子 */

        .sentence.active {
            background: #ebe5d9;
            color: #111111;
        }

        .signature {
            margin-top: 42px;
            text-align: right;
            font-size: 18px;
            line-height: 1.8;
        }

        .bottom-note {
            margin-top: 32px;
            text-align: center;
            font-size: 14px;
            color: #777777;
        }

        /* 手机 */

        @media (max-width: 600px) {
            .page {
                padding: 32px 16px 60px;
            }

            .intro h1 {
                font-size: 27px;
            }

            .intro p {
                font-size: 16px;
            }

            .player {
                padding: 28px 20px;
            }

            .play-button {
                width: 120px;
                height: 120px;
                font-size: 48px;
            }

            .letter {
                padding: 32px 24px;
            }

            .letter-content {
                font-size: 19px;
                line-height: 2.1;
            }
        }

        /* 减少动态效果：无障碍友好 */

        @media (prefers-reduced-motion: reduce) {
            .play-button,
            .sentence,
            .progress-bar {
                transition: none;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- 顶部 -->

    <header class="intro">
        <h1>给你的一封信</h1>
        <p>有些话，我还是想亲口告诉你。</p>
    </header>


    <!-- 播放器 -->

    <section class="player" aria-label="录音播放器">

        <div class="player-label">
            这是一段我想让你听见的话
        </div>

        <button
            class="play-button"
            id="playButton"
            aria-label="播放录音"
            type="button"
        >
            ▶
        </button>

        <div class="play-text" id="playText">
            播放录音
        </div>

        <div class="time" id="time">
            00:00 / 00:00
        </div>

        <div
            class="progress"
            aria-hidden="true"
        >
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>

        <!-- 真正的音频文件 -->

        <audio
            id="audio"
            preload="metadata"
        >
            <source src="audio.mp3" type="audio/mpeg">
            你的浏览器不支持音频播放。
        </audio>

    </section>


    <!-- 信件 -->

    <article class="letter">

        <h2 class="letter-title">给你：</h2>

        <div class="letter-content" id="letterContent">

            <!--
                这里以后替换成你的真实信件。

                每一句话用一个 span 包起来：
                <span class="sentence" data-start="0" data-end="5">
                    这里是一句话。
                </span>

                data-start = 这句话开始播放的秒数
                data-end   = 这句话结束播放的秒数

                例如：
                录音 00:00 - 00:05 是第一句话
                就写：
                data-start="0" data-end="5"
            -->

            <span class="sentence" data-start="0" data-end="5">
                前几天，我突然梦见了你。
            </span>

            <span class="sentence" data-start="5" data-end="11">
                醒来以后，我想了很久。
            </span>

            <span class="sentence" data-start="11" data-end="18">
                有些事情，我一直觉得应该和你说清楚。
            </span>

            <span class="sentence" data-start="18" data-end="25">
                所以我写了这封信，也录下了这些话。
            </span>

            <span class="sentence" data-start="25" data-end="32">
                我不知道你看到这些，或者听到这些的时候，会是什么感觉。
            </span>

            <span class="sentence" data-start="32" data-end="40">
                但我还是希望，你愿意听我把这些话说完。
            </span>

        </div>


        <div class="signature">
            <div>—— 写给你</div>
        </div>

    </article>


    <div class="bottom-note">
        愿你慢慢听，不着急。
    </div>

</div>


<script>

    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");
    const playText = document.getElementById("playText");
    const timeDisplay = document.getElementById("time");
    const progressBar = document.getElementById("progressBar");

    const sentences = document.querySelectorAll(".sentence");


    // 格式化时间

    function formatTime(seconds) {

        if (!isFinite(seconds)) {
            return "00:00";
        }

        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);

        return String(minutes).padStart(2, "0")
            + ":"
            + String(secs).padStart(2, "0");
    }


    // 播放 / 暂停

    playButton.addEventListener("click", function () {

        if (audio.paused) {

            audio.play();

        } else {

            audio.pause();

        }

    });


    // 开始播放

    audio.addEventListener("play", function () {

        playButton.textContent = "Ⅱ";
        playButton.setAttribute("aria-label", "暂停录音");
        playText.textContent = "暂停播放";

    });


    // 暂停

    audio.addEventListener("pause", function () {

        playButton.textContent = "▶";
        playButton.setAttribute("aria-label", "播放录音");
        playText.textContent = "继续播放";

    });


    // 音频加载完成

    audio.addEventListener("loadedmetadata", function () {

        timeDisplay.textContent =
            "00:00 / " + formatTime(audio.duration);

    });


    // 播放过程中

    audio.addEventListener("timeupdate", function () {

        const current = audio.currentTime;
        const duration = audio.duration;

        if (duration) {

            const percent = (current / duration) * 100;

            progressBar.style.width = percent + "%";

        }

        timeDisplay.textContent =
            formatTime(current)
            + " / "
            + formatTime(duration);


        // 判断当前应该高亮哪一句

        sentences.forEach(function (sentence) {

            const start = parseFloat(sentence.dataset.start);
            const end = parseFloat(sentence.dataset.end);

            if (
                current >= start &&
                current < end
            ) {

                sentence.classList.add("active");

            } else {

                sentence.classList.remove("active");

            }

        });

    });


    // 播放结束

    audio.addEventListener("ended", function () {

        playButton.textContent = "▶";
        playButton.setAttribute("aria-label", "重新播放录音");
        playText.textContent = "重新播放";

        progressBar.style.width = "100%";

        sentences.forEach(function (sentence) {

            sentence.classList.remove("active");

        });

    });

</script>

</body>
</html>
